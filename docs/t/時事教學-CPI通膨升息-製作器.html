<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>輪播貼文製作器 — HANNA STORY</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/*
 * app.css — 製作器介面（外框 UI）樣式。
 * 卡片本身的樣式在 js/card-style.js 的 CARD_CSS，這裡只管工具的操作介面。
 * 走跟模板一致的暗色 + 鵝黃金調性。
 */

:root{
  --gold:#f6dfa3;
  --bg:#0e0e0e;
  --panel:#161513;
  --panel-2:#1d1c19;
  --line:rgba(246,223,163,.16);
  --text:#ece7dc;
  --muted:#9a9482;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans TC',system-ui,sans-serif;
  line-height:1.6;
}

/* ── 頂欄 ── */
.app-header{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:14px 22px;
  background:rgba(14,14,14,.92);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
}
.app-header h1{
  font-size:18px; font-weight:700; letter-spacing:.04em;
}
.app-header h1 .mark{color:var(--gold)}
.app-header .sub{font-size:12px;color:var(--muted)}
.app-header .spacer{flex:1}
.app-header .save-state{font-size:12px;color:var(--muted)}
.tpl-pick{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tpl-pick select{width:auto;padding:6px 10px;font-size:13px;color:var(--text)}

/* ── 主要版面：左編輯 右預覽 ── */
.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,560px);
  gap:0;
  align-items:start;
}
.editor{
  padding:22px;
  border-right:1px solid var(--line);
  min-height:calc(100vh - 55px);
}
.preview-pane{
  position:sticky; top:55px;
  height:calc(100vh - 55px);
  overflow:auto;
  padding:22px;
  display:flex; flex-direction:column; align-items:center; gap:16px;
  background:#111;
}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .editor{border-right:none;border-bottom:1px solid var(--line);min-height:auto}
  .preview-pane{position:static;height:auto}
}

/* ── 區塊卡 ── */
.section{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px 18px;
  margin-bottom:18px;
}
.section > h2{
  font-size:13px; font-weight:700; letter-spacing:.14em;
  color:var(--gold); text-transform:uppercase;
  margin-bottom:14px;
}

/* ── 表單 ── */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{
  display:block; font-size:12px; color:var(--muted);
  margin-bottom:5px; letter-spacing:.03em;
}
.field .hint{color:var(--gold);opacity:.75}
input[type=text], textarea, select{
  width:100%;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:9px;
  color:var(--text);
  font-family:inherit; font-size:14px;
  padding:9px 11px;
  transition:border-color .15s;
}
input[type=text]:focus, textarea:focus, select:focus{
  outline:none; border-color:rgba(246,223,163,.55);
}
textarea{resize:vertical; min-height:64px; line-height:1.7}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── 卡片列表 ── */
.card-item{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  margin-bottom:14px;
  overflow:hidden;
}
.card-item.active{border-color:rgba(246,223,163,.55)}
.card-head{
  display:flex; align-items:center; gap:10px;
  padding:12px 14px;
  cursor:pointer;
  user-select:none;
}
.card-head .idx{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(246,223,163,.12);color:var(--gold);
  font-size:12px;font-weight:700;flex-shrink:0;
}
.card-head .kind{
  font-size:11px;color:#111;background:var(--gold);
  padding:2px 8px;border-radius:999px;font-weight:700;flex-shrink:0;
}
.card-head .kind.inner{background:rgba(246,223,163,.25);color:var(--gold)}
.card-head .title-preview{
  flex:1;font-size:13px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-head .chevron{color:var(--muted);font-size:12px;transition:transform .2s}
.card-item.open .chevron{transform:rotate(90deg)}
.card-body{display:none;padding:4px 14px 16px;border-top:1px solid var(--line)}
.card-item.open .card-body{display:block}

/* ── 照片上傳 ── */
.photo-slot{
  display:flex;gap:12px;align-items:center;
  margin-bottom:12px;
}
.photo-thumb{
  width:72px;height:90px;border-radius:8px;flex-shrink:0;
  background:#000 center/cover no-repeat;
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:11px;text-align:center;
}
/* 去背 PNG 縮圖：淺色棋盤底，看得出透明 */
.photo-thumb.transparent{
  background-color:#e9e7e2;background-size:contain;
  background-image:
    linear-gradient(45deg,#cfccc4 25%,transparent 25%),
    linear-gradient(-45deg,#cfccc4 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#cfccc4 75%),
    linear-gradient(-45deg,transparent 75%,#cfccc4 75%);
  background-position:0 0,0 6px,6px -6px,-6px 0;
  background-size:12px 12px;
}
.photo-actions{flex:1;display:flex;flex-direction:column;gap:6px}
.cut-opt{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer}
.cut-opt input{width:auto;margin:0}

/* ── 卡片工具列 ── */
.card-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ── 按鈕 ── */
.btn{
  font-family:inherit;font-size:13px;font-weight:600;
  color:#111;background:var(--gold);
  border:none;border-radius:999px;padding:8px 16px;cursor:pointer;
  transition:opacity .15s, background .15s;
}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(246,223,163,.5)}
.btn.ghost:hover{background:rgba(246,223,163,.08)}
.btn.danger{background:transparent;color:#e08a7a;border:1px solid rgba(224,138,122,.4)}
.btn.danger:hover{background:rgba(224,138,122,.1)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-file{position:relative;overflow:hidden}
.btn-file input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ── 預覽舞台 ── */
.stage-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.stage-box{position:relative;overflow:hidden;margin:0 auto;border-radius:2px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.stage{position:relative;width:1080px;height:1350px;transform-origin:top left}
.stage .slide{position:absolute;inset:0;display:none}
.stage .slide.on{display:block}

.pv-nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#444;cursor:pointer}
.dot.on{background:var(--gold)}

.note{
  max-width:520px;font-size:12px;line-height:1.7;color:#c9b98a;
  background:rgba(246,223,163,.08);border:1px solid rgba(246,223,163,.22);
  border-radius:12px;padding:10px 14px;text-align:center;
}

.cap-preview{
  max-width:520px;width:100%;background:#1b1b1b;border-radius:12px;
  padding:14px 16px;white-space:pre-wrap;font-size:13px;line-height:1.7;color:#ddd;
  border:1px solid var(--line);
}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--gold);color:#111;font-size:13px;font-weight:600;
  padding:10px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  z-index:50;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

.hint-block{
  font-size:12px;color:var(--muted);line-height:1.7;
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:14px;
}
.hint-block b{color:var(--gold)}

</style>
</head>
<body>

<header class="app-header">
  <h1><span class="mark">✦</span> 輪播貼文製作器</h1>
  <label class="tpl-pick">模板
    <select id="tplSelect"></select>
  </label>
  <div class="spacer"></div>
  <span class="save-state" id="saveState">已自動儲存</span>
  <button class="btn ghost sm" id="btnExport">匯出獨立 HTML</button>
  <button class="btn danger sm" id="btnReset">重設此模板</button>
</header>

<div class="layout">
  <!-- ── 左：編輯 ── -->
  <div class="editor">

    <div class="hint-block" id="hintBlock"></div>

    <!-- 全域設定（依模板動態產生）-->
    <div class="section">
      <h2>全域設定</h2>
      <div id="settingsFields"></div>
    </div>

    <!-- 卡片列表 -->
    <div class="section">
      <h2>卡片內容</h2>
      <div id="cardList"></div>
      <div class="card-tools" id="addButtons"></div>
    </div>

    <!-- Caption -->
    <div class="section">
      <h2>Caption 文案</h2>
      <div class="field">
        <label>短斷句：一句一行、意群間空一行、最後接 CTA，末行放主題 hashtag</label>
        <textarea id="setCaption" rows="10"></textarea>
      </div>
      <button class="btn ghost sm" id="btnFillHashtag">把主題 Hashtag 補到末行</button>
    </div>

  </div>

  <!-- ── 右：預覽 ── -->
  <div class="preview-pane">
    <div class="stage-wrap">
      <div class="stage-box" id="stageBox"><div class="stage" id="stage"></div></div>
      <div class="pv-nav">
        <button class="btn ghost sm" id="pvPrev">◀</button>
        <div class="dots" id="dots"></div>
        <button class="btn ghost sm" id="pvNext">▶</button>
      </div>
      <div class="pv-nav">
        <button class="btn sm" id="dlOne">下載此張 PNG</button>
        <button class="btn sm" id="dlAll">下載全部 PNG</button>
        <button class="btn ghost sm" id="copyCap">複製整段 Caption</button>
      </div>
      <div class="note">⚠️ 下載要用 <b>Chrome / Safari 在本機開啟這個 HTML</b> 才有效，在對話預覽框內點按鈕沒反應是正常現象。</div>
      <div class="cap-preview" id="capPreview"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 依序載入（classic script，才能用 file:// 本機開啟） -->
<script>
/*
 * card-style.js
 * ------------------------------------------------------------------
 * 「五月天真人照輪播模板」的卡片設計系統 CSS（規格 §2、§3、§7、§12）。
 *
 * 這段 CSS 是「唯一真相來源」：
 *   - 製作器的即時預覽會把它注入 <style>
 *   - 匯出的獨立 HTML 也直接內嵌同一份
 * 兩邊共用同一份，保證「預覽長怎樣、下載出來就長怎樣」。
 *
 * 想換品牌色：只改下面的 --gold 一個變數即可，其餘結構不動（規格 §2）。
 */
(function (global) {
  'use strict';

  // Google Fonts：標題 Noto Serif TC 700／內文 Noto Sans TC 300、500（規格 §1）
  global.CARD_FONTS_LINK =
    '<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">';

  // html2canvas 1.4.1（規格 §8）
  global.HTML2CANVAS_SRC =
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

  // 卡片原生尺寸（規格 §1）
  global.CARD_W = 1080;
  global.CARD_H = 1350;

  global.CARD_CSS = `
  :root{
    --gold:#f6dfa3;                 /* 鵝黃金：唯一主色（規格 §2） */
    --gold-line:rgba(246,223,163,.8);
    --gold-rule:rgba(246,223,163,.45);
  }

  /* 一張原生卡：1080×1350 純黑底、全出血（規格 §1、§3） */
  .card{
    position:relative; width:1080px; height:1350px;
    background:#000; overflow:hidden;
    font-family:'Noto Sans TC',sans-serif;
  }
  .card .photo{
    position:absolute; top:0; left:0; width:1080px; height:1350px;
    object-fit:cover; display:block;
  }
  /* 沒放照片時的占位（純預覽用；匯出前請補上照片） */
  .card .photo-empty{
    background:
      radial-gradient(120% 80% at 50% 0%, #262015 0%, #000 70%);
  }
  .card .photo-empty::after{
    content:'尚未放入照片'; position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:rgba(246,223,163,.35); font-size:34px; letter-spacing:.2em;
  }

  /* 遮罩（規格 §7） */
  .card .grad{position:absolute; inset:0;}
  .card.cover .grad{
    background:linear-gradient(to bottom,
      rgba(0,0,0,.22) 0%, transparent 14%, transparent 46%,
      rgba(0,0,0,.20) 60%, rgba(0,0,0,.58) 78%,
      rgba(0,0,0,.88) 90%, #000 100%);
  }
  .card.inner .grad{background:rgba(0,0,0,.52);}   /* 依照片亮度在 .45–.62 之間微調 */

  /* 頂欄：01｜08 ── 系列英文標（規格 §3） */
  .card .topbar{
    position:absolute; top:52px; left:0; right:0; padding:0 66px;
    display:flex; justify-content:space-between; align-items:center;
    color:rgba(255,255,255,.85); font-size:23px; letter-spacing:.22em;
    text-shadow:0 1px 8px rgba(0,0,0,.8);
  }

  /* Photo credit：僅非本人照才加，top:104px（規格 §3） */
  .card .credit{
    position:absolute; top:104px; left:0; right:0; padding:0 66px;
    color:rgba(255,255,255,.72); font-size:19px; letter-spacing:.04em;
    text-shadow:0 1px 8px rgba(0,0,0,.9);
  }

  /* 文字區：沉左下（規格 §3） */
  .card .tz{
    position:absolute; left:0; right:0; bottom:0; padding:0 66px 52px;
    text-align:left;
  }
  .card.cta .tz{text-align:center;}   /* CTA 例外置中（規格 §4） */

  /* 左側金線：錨點＋標題共用（規格 §3） */
  .card .accent{
    border-left:4px solid var(--gold-line);
    padding-left:26px; margin-left:-30px; margin-bottom:24px;
  }
  .card.cta .accent{border:none; padding:0; margin:0 0 24px;}

  .card .anchor{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:60px;
    color:var(--gold); line-height:1.25;
  }
  .card .head{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:60px;
    color:#fff; line-height:1.3; margin-top:6px;
  }
  .card .head em{color:var(--gold); font-style:normal;}   /* 關鍵字包 <em> → 鵝黃 */

  .card .body{
    font-family:'Noto Sans TC',sans-serif; font-weight:300; font-size:25px;
    line-height:1.72; color:rgba(255,255,255,.86); margin-top:6px;
  }
  .card .rule{
    width:80px; height:1px; background:var(--gold-rule); margin:26px 0;
  }
  .card.cta .rule{margin:26px auto;}

  .card .close{
    font-size:32px; font-weight:500; color:var(--gold); line-height:1.4;
  }
  .card .foot{
    margin-top:26px; font-size:19px; color:rgba(255,255,255,.34);
    letter-spacing:.05em;
  }

  /* 所有文字用雙層陰影浮字，取代暗色底板（規格 §3、§12） */
  .card .anchor,.card .head,.card .body,.card .close,.card .foot,.card .credit{
    text-shadow:0 1px 8px rgba(0,0,0,.95), 0 2px 26px rgba(0,0,0,.75);
  }
  `;
})(window);

</script>
<script>
/*
 * render.js
 * ------------------------------------------------------------------
 * 由「一張卡的資料」產生卡片 HTML 字串。
 * 製作器預覽與匯出的獨立 HTML 共用這支，確保兩邊長得一模一樣。
 *
 * 卡片資料格式：
 *   {
 *     type:  'cover' | 'inner' | 'cta',
 *     anchor:'錨點（歌名／主題詞）',
 *     head:  '標題，關鍵字用 *星號* 包住 → 會變鵝黃 <em>',
 *     body:  '內文段落（換行會保留）',
 *     close: '收尾句',
 *     credit:'Photo from IG@xxx（非本人照才填，可留空）',
 *     img:   'data:image/jpeg;base64,...'（可留空 → 顯示占位）
 *   }
 */
(function (global) {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // *關鍵字* → <em>關鍵字</em>（在跳脫之後套用，安全）
  function emphasize(s) {
    return s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  }

  function nl2br(s) {
    return s.replace(/\r?\n/g, '<br>');
  }

  // 標題：跳脫 → 星號轉 em → 換行
  function fmtHead(s) {
    return nl2br(emphasize(esc(s)));
  }
  // 一般文字：跳脫 → 換行
  function fmtText(s) {
    return nl2br(esc(s));
  }

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  /**
   * @param {object} card   卡片資料
   * @param {number} index  0-based
   * @param {number} total  總張數
   * @param {object} settings { seriesLabel, account }
   * @param {boolean} active 是否為目前顯示中（加上 .on）
   */
  function renderCardHTML(card, index, total, settings, active) {
    var type = card.type || 'inner';
    var cls =
      'slide ' +
      (type === 'cover' ? 'cover' : type === 'cta' ? 'inner cta' : 'inner');
    if (active) cls += ' on';

    var num = pad2(index + 1) + '｜' + pad2(total);
    var seriesLabel = esc(settings.seriesLabel || '');
    var account = esc(settings.account || '');

    var photo = card.img
      ? '<img class="photo" src="' + card.img + '" alt="">'
      : '<div class="photo photo-empty"></div>';

    var credit = card.credit
      ? '<div class="credit">' + fmtText(card.credit) + '</div>'
      : '';

    // 錨點 + 標題 共用左側金線
    var anchorEl = card.anchor
      ? '<div class="anchor">' + fmtHead(card.anchor) + '</div>'
      : '';
    var headEl = card.head
      ? '<div class="head">' + fmtHead(card.head) + '</div>'
      : '';
    var accent =
      anchorEl || headEl
        ? '<div class="accent">' + anchorEl + headEl + '</div>'
        : '';

    var bodyEl = card.body ? '<div class="body">' + fmtText(card.body) + '</div>' : '';
    var closeEl = card.close ? '<div class="close">' + fmtText(card.close) + '</div>' : '';

    return (
      '<div class="card ' + cls + '" data-i="' + index + '">' +
        photo +
        '<div class="grad"></div>' +
        '<div class="topbar"><span>' + num + '</span><span>' + seriesLabel + '</span></div>' +
        credit +
        '<div class="tz">' +
          accent +
          bodyEl +
          '<div class="rule"></div>' +
          closeEl +
          '<div class="foot">' + account + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  global.renderCardHTML = renderCardHTML;
})(window);

</script>
<script>
/*
 * photo.js
 * ------------------------------------------------------------------
 * 瀏覽器內把照片預裁成「精確 1080×1350（4:5）」+ 壓縮成 base64（規格 §6）。
 *
 * 為什麼在瀏覽器裁：html2canvas 會忽略 CSS object-fit，直式照直接塞會被拉扁。
 * 所以照片框比例必須＝卡片比例。原本規格用 Python 預裁，這裡改用 canvas 裁，
 * 效果一樣、還不用另外跑 Python。
 *
 *   - 太寬 → 裁左右（置中）

 * app.js — 製作器主程式（多模板）
 * ------------------------------------------------------------------
 * 依 templates.js 的註冊表運作：全域設定、卡片欄位、預覽、下載都由模板 schema 驅動。
 * 每套模板各自存一份內容（切換不會互相覆蓋）。
 */
(function () {
  'use strict';

  // 可選的「預設主題」：由打包後的單檔在載入前注入 window.CAROUSEL_PRESET
  //   { ns:'timing', active:'B', states:{ B:{...state...} } }
  // ns 讓不同主題的單檔各存各的 localStorage，不互相蓋。
  var PRESET = (window.CAROUSEL_PRESET && typeof window.CAROUSEL_PRESET === 'object') ? window.CAROUSEL_PRESET : null;

  var STORE_PREFIX = 'hanna_carousel_v3_' + (PRESET && PRESET.ns ? PRESET.ns + '_' : '');
  var ACTIVE_KEY = 'hanna_active_v3' + (PRESET && PRESET.ns ? '_' + PRESET.ns : '');

  function presetState(t) {
    if (!PRESET || !PRESET.states || !PRESET.states[t]) return null;
    var s = JSON.parse(JSON.stringify(PRESET.states[t]));
    s.template = t;
    s._pv = PRESET.version || null;
    (s.cards || []).forEach(function (c, i) { if (!c.id) c.id = 'p' + i + Math.random().toString(36).slice(2, 6); });
    return s;
  }

  var HINTS = {
    A: '滿版真人照 + 鵝黃金字，文字沉左下。標題想讓關鍵字變<b>鵝黃</b>，用星號包住：<b>10 年喝掉 *54 萬*</b>。上傳照片會自動裁成 1080×1350。',
    B: '白底 + 去背產品圖 + 大數字（機會成本／對比）。上傳圖片時勾「<b>自動去背（白底）</b>」，白底商品照會自動去背；灰牆／複雜背景建議先用去背 App。「對比 VS」頁左右各放一張圖與大數字；文字可換行。',
  };

  // 把模板 CSS 注入頁面（切換時替換）
  var tplStyle = document.createElement('style');
  document.head.appendChild(tplStyle);

  // ── 狀態 ──
  var activeTemplate = loadActive();
  var state = loadState(activeTemplate) || presetState(activeTemplate) || window.TEMPLATES[activeTemplate].defaultState();
  var cur = 0;
  var openId = state.cards[0] && state.cards[0].id;

  function tpl() { return window.TEMPLATES[state.template]; }

  function loadActive() {
    // 預設用「極簡白對比（模板 B）」——使用者偏好（見 CLAUDE.md）；有預設主題就用它指定的
    var fallback = (PRESET && PRESET.active && window.TEMPLATES[PRESET.active]) ? PRESET.active : 'B';
    try {
      var a = localStorage.getItem(ACTIVE_KEY);
      return (a && window.TEMPLATES[a]) ? a : fallback;
    } catch (e) { return fallback; }
  }
  function saveActive() {
    try { localStorage.setItem(ACTIVE_KEY, activeTemplate); } catch (e) {}
  }
  function loadState(t) {
    try {
      var raw = localStorage.getItem(STORE_PREFIX + t);
      if (!raw) return null;
      var s = JSON.parse(raw);
      s.template = t;
      // 預設主題有更新版本（_pv 不同）→ 丟棄舊存檔，改用新內容
      if (PRESET && PRESET.version && s._pv !== PRESET.version) return null;
      return s;
    } catch (e) { return null; }
  }
  function save() {
    var el = $('saveState');
    try {
      localStorage.setItem(STORE_PREFIX + state.template, JSON.stringify(state));
      el.textContent = '已自動儲存';
    } catch (e) {
      try {
        var stripped = JSON.parse(JSON.stringify(state));
        stripped.cards.forEach(function (c) {
          Object.keys(c).forEach(function (k) {
            if (typeof c[k] === 'string' && c[k].indexOf('data:image') === 0) c[k] = '';
          });
        });
        localStorage.setItem(STORE_PREFIX + state.template, JSON.stringify(stripped));
        el.textContent = '已存文字（照片過大未存，請盡快匯出）';
      } catch (e2) { el.textContent = '無法自動儲存'; }
    }
  }

  // ── DOM 小工具 ──
  function $(id) { return document.getElementById(id); }
  function el(html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, 1800);
  }

  // ================================================================
  //  模板切換
  // ================================================================
  function buildTemplateSelect() {
    var sel = $('tplSelect');
    sel.innerHTML = '';
    window.TEMPLATE_ORDER.forEach(function (id) {
      var o = el('<option value="' + id + '">' + esc(window.TEMPLATES[id].name) + '</option>');
      sel.appendChild(o);
    });
    sel.value = activeTemplate;
    sel.addEventListener('change', function () {
      switchTemplate(sel.value);
    });
  }

  function switchTemplate(t) {
    if (t === state.template) return;
    save();                                  // 存目前模板
    activeTemplate = t;
    saveActive();
    state = loadState(t) || presetState(t) || window.TEMPLATES[t].defaultState();
    cur = 0;
    openId = state.cards[0] && state.cards[0].id;
    buildAll();
    toast('已切換到「' + window.TEMPLATES[t].name + '」');
  }

  // ================================================================
  //  編輯區
  // ================================================================
  function buildEditor() {
    $('hintBlock').innerHTML = HINTS[state.template] || '';

    // 全域設定
    var sf = $('settingsFields');
    sf.innerHTML = '';
    tpl().settingsSchema.forEach(function (spec) {
      sf.appendChild(settingsField(spec));
    });

    // Caption
    $('setCaption').value = state.caption || '';

    // 新增卡片按鈕（依模板型態）
    var ab = $('addButtons');
    ab.innerHTML = '';
    tpl().types.forEach(function (ty) {
      if (ty.id === 'cover') return;   // 封面通常只有一張，不放快速新增
      var b = el('<button class="btn ghost sm">＋ ' + esc(ty.label) + '</button>');
      b.addEventListener('click', function () {
        var c = tpl().newCard(ty.id);
        state.cards.push(c);
        openId = c.id; cur = state.cards.length - 1;
        onStructureChange();
      });
      ab.appendChild(b);
    });

    // 卡片列表
    var list = $('cardList');
    list.innerHTML = '';
    state.cards.forEach(function (card, i) { list.appendChild(buildCardItem(card, i)); });
  }

  function settingsField(spec) {
    var f = el('<div class="field"><label>' + esc(spec.label) + '</label></div>');
    var input = el('<input type="text">');
    input.value = (state.settings[spec.key] != null) ? state.settings[spec.key] : '';
    input.addEventListener('input', function () {
      state.settings[spec.key] = input.value;
      buildPreview(); save();
    });
    f.appendChild(input);
    return f;
  }

  function buildCardItem(card, i) {
    var total = state.cards.length;
    var isOpen = card.id === openId;
    var typeLabel = (function () {
      var ty = tpl().types.filter(function (t) { return t.id === card.type; })[0];
      return ty ? ty.label : card.type;
    })();
    var kindCls = card.type === 'cover' ? '' : 'inner';

    var item = el('<div class="card-item ' + (isOpen ? 'open ' : '') + (i === cur ? 'active' : '') + '"></div>');

    var head = el(
      '<div class="card-head">' +
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span class="kind ' + kindCls + '">' + esc(typeLabel) + '</span>' +
        '<span class="title-preview">' + esc(tpl().titlePreview(card) || '（空白）') + '</span>' +
        '<span class="chevron">▶</span>' +
      '</div>'
    );
    head.addEventListener('click', function () {
      openId = (openId === card.id) ? null : card.id;
      cur = i; buildEditor(); buildPreview();
    });
    item.appendChild(head);

    var body = el('<div class="card-body"></div>');

    // 類型
    var fType = el('<div class="field"><label>類型</label><select></select></div>');
    var sel = fType.querySelector('select');
    tpl().types.forEach(function (ty) {
      sel.appendChild(el('<option value="' + ty.id + '">' + esc(ty.label) + '</option>'));
    });
    sel.value = card.type;
    sel.addEventListener('change', function () {
      var d = tpl().newCard(sel.value);
      Object.keys(d).forEach(function (k) {
        if (k !== 'id' && k !== 'type' && !(k in card)) card[k] = d[k];
      });
      card.type = sel.value;
      onStructureChange();
    });
    body.appendChild(fType);

    // 欄位（依模板 schema）
    tpl().fields(card.type).forEach(function (spec) {
      if (spec.kind === 'image') body.appendChild(imageField(card, spec));
      else body.appendChild(textField(card, spec));
    });

    // 工具列
    var tools = el('<div class="card-tools"></div>');
    var up = el('<button class="btn ghost sm">▲ 上移</button>');
    var down = el('<button class="btn ghost sm">▼ 下移</button>');
    var del = el('<button class="btn danger sm">刪除此卡</button>');
    up.disabled = i === 0;
    down.disabled = i === total - 1;
    up.addEventListener('click', function () { moveCard(i, -1); });
    down.addEventListener('click', function () { moveCard(i, 1); });
    del.addEventListener('click', function () {
      if (total <= 1) { toast('至少要保留一張卡'); return; }
      state.cards.splice(i, 1);
      if (cur >= state.cards.length) cur = state.cards.length - 1;
      onStructureChange();
    });
    tools.appendChild(up); tools.appendChild(down); tools.appendChild(del);
    body.appendChild(tools);

    item.appendChild(body);
    return item;
  }

  function textField(card, spec) {
    var f = el('<div class="field"><label>' + esc(spec.label) + '</label></div>');
    var input = spec.kind === 'textarea'
      ? el('<textarea rows="3"></textarea>')
      : el('<input type="text">');
    input.value = card[spec.key] || '';
    input.addEventListener('input', function () {
      card[spec.key] = input.value;
      buildPreview();
      var itemHead = input.closest('.card-item').querySelector('.title-preview');
      if (itemHead) itemHead.textContent = tpl().titlePreview(card) || '（空白）';
      save();
    });
    f.appendChild(input);
    return f;
  }

  function imageField(card, spec) {
    var f = el('<div class="field"><label>' + esc(spec.label) + '</label></div>');
    var slot = el('<div class="photo-slot"></div>');
    var thumb = el('<div class="photo-thumb' + (spec.imageMode === 'transparent' ? ' transparent' : '') + '">' + (card[spec.key] ? '' : '未放') + '</div>');
    if (card[spec.key]) {
      thumb.style.backgroundImage = 'url(' + card[spec.key] + ')';
      thumb.style.backgroundSize = spec.imageMode === 'transparent' ? 'contain' : 'cover';
      thumb.style.backgroundRepeat = 'no-repeat';
      thumb.style.backgroundPosition = 'center';
    }
    var actions = el('<div class="photo-actions"></div>');
    var fileBtn = el('<label class="btn ghost sm btn-file">' + (card[spec.key] ? '更換' : '上傳') + '<input type="file" accept="image/*"></label>');
    var fileInput = fileBtn.querySelector('input');

    // 去背選項（僅透明圖模式）：白底商品照可一鍵去背
    var cutChk = null;
    if (spec.imageMode === 'transparent') {
      var cutWrap = el('<label class="cut-opt"><input type="checkbox" checked> 上傳時自動去背（白底）</label>');
      cutChk = cutWrap.querySelector('input');
      actions.appendChild(fileBtn);
      actions.appendChild(cutWrap);
    } else {
      actions.appendChild(fileBtn);
    }

    fileInput.addEventListener('change', function () {
      var fl = fileInput.files && fileInput.files[0];
      if (!fl) return;
      thumb.textContent = '處理中…';
      var job;
      if (spec.imageMode === 'transparent') {
        job = (cutChk && cutChk.checked) ? window.removeSolidBg(fl, { maxDim: 1000 }) : window.fitPhoto(fl, 1000);
      } else {
        job = window.cropPhoto(fl, 0.10);
      }
      job.then(function (dataURL) {
        card[spec.key] = dataURL;
        buildEditor(); buildPreview(); save();
        toast(spec.imageMode === 'transparent'
          ? ((cutChk && cutChk.checked) ? '已去背並放入' : '去背圖已放入')
          : '照片已裁成 1080×1350');
      }).catch(function () { thumb.textContent = '失敗'; toast('圖片處理失敗'); });
      fileInput.value = '';
    });
    if (card[spec.key]) {
      var rm = el('<button class="btn danger sm">移除</button>');
      rm.addEventListener('click', function () {
        card[spec.key] = ''; buildEditor(); buildPreview(); save();
      });
      actions.appendChild(rm);
    }
    slot.appendChild(thumb); slot.appendChild(actions);
    f.appendChild(slot);
    return f;
  }

  function moveCard(i, dir) {
    var j = i + dir;
    if (j < 0 || j >= state.cards.length) return;
    var tmp = state.cards[i]; state.cards[i] = state.cards[j]; state.cards[j] = tmp;
    cur = j; onStructureChange();
  }

  function onStructureChange() { buildEditor(); buildPreview(); save(); }

  // ================================================================
  //  預覽區
  // ================================================================
  function buildPreview() {
    tplStyle.textContent = tpl().css;

    var total = state.cards.length;
    if (cur >= total) cur = total - 1;
    if (cur < 0) cur = 0;

    var stage = $('stage');
    stage.innerHTML = state.cards
      .map(function (c, i) { return tpl().render(c, i, total, state.settings, i === cur); })
      .join('');

    var dots = $('dots');
    dots.innerHTML = '';
    state.cards.forEach(function (_, i) {
      var d = el('<div class="dot ' + (i === cur ? 'on' : '') + '"></div>');
      d.addEventListener('click', function () { showCard(i); });
      dots.appendChild(d);
    });

    $('capPreview').textContent = state.caption || '';
    fit();
  }

  function showCard(i) {
    var total = state.cards.length;
    cur = (i + total) % total;
    document.querySelectorAll('#stage .slide').forEach(function (c, k) { c.classList.toggle('on', k === cur); });
    document.querySelectorAll('#dots .dot').forEach(function (d, k) { d.classList.toggle('on', k === cur); });
    document.querySelectorAll('#cardList .card-item').forEach(function (it, k) { it.classList.toggle('active', k === cur); });
  }

  function fit() {
    var wrap = document.querySelector('.stage-wrap');
    var box = $('stageBox'), stage = $('stage');
    var avail = Math.min(wrap.clientWidth, 560);
    var s = Math.min(avail / 1080, (window.innerHeight * 0.66) / 1350);
    stage.style.transform = 'scale(' + s + ')';
    box.style.width = 1080 * s + 'px';
    box.style.height = 1350 * s + 'px';
  }
  window.addEventListener('resize', fit);

  // ================================================================
  //  下載 PNG
  // ================================================================
  function downloadCard(index) {
    var cardEl = document.querySelectorAll('#stage .slide')[index];
    if (!cardEl) return Promise.resolve();
    var seed = (state.settings.account || state.settings.signature || 'hanna').replace(/[^a-zA-Z0-9_]/g, '') || 'hanna';
    var name = seed + '_' + String(index + 1).padStart(2, '0') + '.png';
    var bg = tpl().bg || '#000';
    var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    return ready.then(function () {
      var clone = cardEl.cloneNode(true);
      Object.assign(clone.style, { position: 'fixed', left: '-9999px', top: '0', transform: 'none', display: 'block' });
      document.body.appendChild(clone);
      return window.html2canvas(clone, { scale: 1, backgroundColor: bg, useCORS: true, logging: false })
        .then(function (canvas) {
          document.body.removeChild(clone);
          return new Promise(function (res) {
            canvas.toBlob(function (b) {
              var a = document.createElement('a');
              a.href = URL.createObjectURL(b); a.download = name; a.click();
              URL.revokeObjectURL(a.href); res();
            }, 'image/png');
          });
        });
    });
  }

  function exportHTML() {
    var html = window.buildStandaloneHTML(state);
    var seed = (state.settings.account || state.settings.signature || 'hanna').replace(/[^a-zA-Z0-9_]/g, '') || 'hanna';
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = seed + '_' + state.template + '_carousel.html';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已匯出獨立 HTML');
  }

  // ================================================================
  //  事件
  // ================================================================
  function bind() {
    $('setCaption').addEventListener('input', function () {
      state.caption = this.value; $('capPreview').textContent = this.value; save();
    });
    $('btnFillHashtag').addEventListener('click', function () {
      var tag = (state.settings.hashtag || '').trim();
      if (!tag) { toast('先在全域設定填主題 Hashtag'); return; }
      var cap = (state.caption || '').replace(/\s*$/, '');
      if (!new RegExp(tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*$').test(cap)) {
        cap += '\n\n' + tag;
      }
      state.caption = cap; $('setCaption').value = cap; $('capPreview').textContent = cap; save();
    });

    $('pvPrev').addEventListener('click', function () { showCard(cur - 1); });
    $('pvNext').addEventListener('click', function () { showCard(cur + 1); });
    window.addEventListener('keydown', function (e) {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if (e.key === 'ArrowLeft') showCard(cur - 1);
      if (e.key === 'ArrowRight') showCard(cur + 1);
    });

    $('dlOne').addEventListener('click', function () { toast('產生 PNG 中…'); downloadCard(cur); });
    $('dlAll').addEventListener('click', function () {
      toast('產生全部 PNG 中…');
      var p = Promise.resolve();
      state.cards.forEach(function (_, i) { p = p.then(function () { return downloadCard(i); }); });
    });
    $('copyCap').addEventListener('click', function () {
      navigator.clipboard.writeText(state.caption || '').then(
        function () { toast('Caption 已複製'); },
        function () { toast('複製失敗，請手動選取'); }
      );
    });

    $('btnExport').addEventListener('click', exportHTML);
    $('btnReset').addEventListener('click', function () {
      if (!confirm('確定要清空「' + tpl().name + '」的內容、恢復預設範例嗎？')) return;
      state = presetState(state.template) || window.TEMPLATES[state.template].defaultState();
      cur = 0; openId = state.cards[0].id;
      buildAll(); toast('已重設此模板');
    });
  }

  function buildAll() { buildEditor(); buildPreview(); }

  // ── 啟動 ──
  buildTemplateSelect();
  buildAll();
  bind();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();

</script>
</body>
</html>
