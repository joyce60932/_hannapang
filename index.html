<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>輪播貼文製作器 — HANNA STORY</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="app-header">
  <h1><span class="mark">✦</span> 輪播貼文製作器</h1>
  <span class="sub">五月天真人照模板 · 1080×1350</span>
  <div class="spacer"></div>
  <span class="save-state" id="saveState">已自動儲存</span>
  <button class="btn ghost sm" id="btnExport">匯出獨立 HTML</button>
  <button class="btn danger sm" id="btnReset">全部重設</button>
</header>

<div class="layout">
  <!-- ── 左：編輯 ── -->
  <div class="editor">

    <div class="hint-block">
      填每張卡的文案 + 放照片，右側即時預覽。標題想讓關鍵字變<b>鵝黃</b>，
      用星號包住：<b>存不到錢不是你*賺得不夠*</b>。內文可直接換行。
      完成後點右上「匯出獨立 HTML」下載成品，或在右側直接下載 PNG。
    </div>

    <!-- 全域設定 -->
    <div class="section">
      <h2>全域設定</h2>
      <div class="row-2">
        <div class="field">
          <label>系列英文標（頂欄右）</label>
          <input type="text" id="setSeries" placeholder="HANNA STORY ✦">
        </div>
        <div class="field">
          <label>帳號 ID（每張頁尾）</label>
          <input type="text" id="setAccount" placeholder="@_hannapang">
        </div>
      </div>
      <div class="field">
        <label>主題 Hashtag <span class="hint">（單一，放 Caption 最後一行）</span></label>
        <input type="text" id="setHashtag" placeholder="#理財知識">
      </div>
    </div>

    <!-- 卡片列表 -->
    <div class="section">
      <h2>卡片內容</h2>
      <div id="cardList"></div>
      <div class="card-tools">
        <button class="btn ghost sm" id="btnAddInner">＋ 新增內頁</button>
        <button class="btn ghost sm" id="btnAddCta">＋ 新增 CTA 頁</button>
      </div>
    </div>

    <!-- Caption -->
    <div class="section">
      <h2>Caption 文案</h2>
      <div class="field">
        <label>短斷句：一句一行、意群間空一行、最後接 CTA，末行放單一主題 hashtag</label>
        <textarea id="setCaption" rows="10" placeholder="存不到錢&#10;不是你賺得不夠&#10;&#10;……&#10;&#10;#理財知識"></textarea>
      </div>
      <button class="btn ghost sm" id="btnFillHashtag">把主題 Hashtag 補到末行</button>
    </div>

  </div>

  <!-- ── 右：預覽 ── -->
  <div class="preview-pane">
    <div class="stage-wrap">
      <div class="stage-box" id="stageBox"><div class="stage" id="stage"></div></div>
      <div class="pv-nav">
        <button class="btn ghost sm" id="pvPrev">◀</button>
        <div class="dots" id="dots"></div>
        <button class="btn ghost sm" id="pvNext">▶</button>
      </div>
      <div class="pv-nav">
        <button class="btn sm" id="dlOne">下載此張 PNG</button>
        <button class="btn sm" id="dlAll">下載全部 PNG</button>
        <button class="btn ghost sm" id="copyCap">複製整段 Caption</button>
      </div>
      <div class="note">⚠️ 下載要用 <b>Chrome / Safari 在本機開啟這個 HTML</b> 才有效，在對話預覽框內點按鈕沒反應是正常現象。</div>
      <div class="cap-preview" id="capPreview"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 依序載入（classic script，才能用 file:// 本機開啟） -->
<script src="js/card-style.js"></script>
<script src="js/render.js"></script>
<script src="js/photo.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
